name: Build and deploy Docker image

on:
  release:
    types:
      - published

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # A published release is tagged with its version (without "v") and "latest" (pre-releases only
    # with their version). A manual run on master is tagged "latest".
    - name: Get Docker image tags from Git ref
      id: docker-tags
      env:
        IMAGE: ghcr.io/traeger-gmbh/release-server
        IS_RELEASE: ${{ github.event_name == 'release' }}
        IS_PRERELEASE: ${{ github.event.release.prerelease == true }}
      run: |
        TAG=$(echo "$GITHUB_REF" | cut -d '/' -f3 | sed -e 's/^v//g')
        if [ "${TAG}" = "master" ];
        then
          TAGS="${IMAGE}:latest"
        else
          TAGS="${IMAGE}:${TAG}"
          if [ "${IS_RELEASE}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ];
          then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
        fi
        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.docker-tags.outputs.tags }}
