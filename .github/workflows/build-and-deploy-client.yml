name: Build and deploy client

on:
  release:
    types:
      - published

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Get Docker image tag from Git ref
      id: docker-tags
      run: |
        TAG=$(echo "$GITHUB_REF" | cut -d '/' -f3 | sed -e 's/^v//g')
        if [ "${TAG}" = "master" ];
        then
          TAG="latest";
        fi
        echo "tags=ghcr.io/traeger-gmbh/release-client:${TAG}" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./sources/release-client/
        file: ./sources/release-client/Dockerfile
        push: true
        tags: ${{ steps.docker-tags.outputs.tags }}
