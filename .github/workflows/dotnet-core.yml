name: build

on: [push, pull_request]

permissions:
  contents: read

env:
  # Production image (2022-04-26) used as reference for the compatibility check
  REFERENCE_IMAGE: ghcr.io/traeger-gmbh/release-server@sha256:39934dd4a42a73ccdd5600a5726f9808ea6dedb123d4c5bf877137039a24ee05

jobs:
  server:
    name: Server on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore
      working-directory: ./sources/ReleaseServer/
    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: ./sources/ReleaseServer/
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
      working-directory: ./sources/ReleaseServer/

  docker:
    name: Docker image and compatibility check
    runs-on: ubuntu-latest
    needs: server

    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Build image (not pushed)
      run: docker build -t release-server:ci .
    - name: Compare with production image
      run: node tools/compat/compat-check.mjs --old "$REFERENCE_IMAGE" --new release-server:ci
