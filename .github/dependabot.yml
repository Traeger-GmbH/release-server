version: 2

# Rules for all ecosystems:
# - Minor and patch updates are grouped into one pull request per ecosystem.
# - Major updates are grouped into a separate pull request per ecosystem, so they are reviewed and
#   decided deliberately. Nothing is merged automatically.
# - Base images and framework packages only follow LTS / stable releases (see the ignore rules).

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/sources/ReleaseServer/ReleaseServer.WebApi"
      - "/sources/ReleaseServer/ReleaseServer.WebApi.Test"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]
      nuget-major:
        update-types: ["major"]
    ignore:
      # FluentAssertions 8 and later is licensed commercially (Xceed); version 7 is Apache 2.0.
      # A change of the license or of the assertion library is a decision of the management.
      - dependency-name: "FluentAssertions"
        versions: [">= 8"]
      # The major version of the ASP.NET Core packages follows the .NET version. The server only
      # uses LTS versions of .NET; the upgrade to the next LTS is done deliberately as a whole.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/sources/release-client"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/sources/release-client"
    schedule:
      interval: "monthly"
    groups:
      docker-images:
        update-types: ["minor", "patch", "major"]
    ignore:
      # .NET: only LTS versions (even major versions)
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        versions: [">= 11, < 12", ">= 13, < 14", ">= 15, < 16", ">= 17, < 18"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        versions: [">= 11, < 12", ">= 13, < 14", ">= 15, < 16", ">= 17, < 18"]
      # Node.js: only LTS versions (even major versions)
      - dependency-name: "node"
        versions: [">= 25, < 26", ">= 27, < 28", ">= 29, < 30", ">= 31, < 32"]
      # nginx: only stable versions (even minor versions; odd minor versions are mainline)
      - dependency-name: "nginx"
        versions: [">= 1.31, < 1.32", ">= 1.33, < 1.34", ">= 1.35, < 1.36", ">= 1.37, < 1.38"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        update-types: ["minor", "patch", "major"]
