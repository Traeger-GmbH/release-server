version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/sources/ReleaseServer/ReleaseServer.WebApi"
      - "/sources/ReleaseServer/ReleaseServer.WebApi.Test"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/sources/release-client"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/sources/release-client"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
